    ;(() => {
      function track(eventName, payload = {}) {
        try {
          if (window.umami && typeof window.umami.track === "function") {
            window.umami.track(eventName, payload);
          }
        } catch (_) {}
      }

      const ATTR_KEY = "taldea_attribution_v1";

      // Limpia y normaliza valores UTM para evitar ruido en analítica
      function sanitizeParam(value) {
        if (!value) return null;
        return String(value)
          .toLowerCase()
          .trim()
          .replace(/\s+/g, "_")
          .replace(/[^a-z0-9._-]/g, "")
          .slice(0, 80) || null;
      }

      // Obtiene UTM desde la URL actual
      function getUtmParamsFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return {
          utm_source: sanitizeParam(params.get("utm_source")),
          utm_medium: sanitizeParam(params.get("utm_medium")),
          utm_campaign: sanitizeParam(params.get("utm_campaign")),
          utm_content: sanitizeParam(params.get("utm_content")),
          utm_term: sanitizeParam(params.get("utm_term"))
        };
      }

      // Clasifica el referrer en categorías simples
      function getReferrerBucket() {
        const ref = document.referrer || "";
        if (!ref) return "direct";

        let host = "";
        try {
          host = new URL(ref).hostname.toLowerCase();
        } catch (_) {
          return "unknown";
        }

        if (!host) return "unknown";

        const currentHost = window.location.hostname.toLowerCase();
        if (host === currentHost || host.endsWith("." + currentHost)) return "internal";

        if (host.includes("instagram.")) return "instagram";
        if (host.includes("whatsapp.")) return "whatsapp";
        if (host.includes("tiktok.")) return "tiktok";
        if (host.includes("facebook.") || host.includes("fb.")) return "facebook";
        if (host.includes("x.com") || host.includes("twitter.")) return "x";
        if (host.includes("youtube.")) return "youtube";
        if (host.includes("reddit.")) return "reddit";
        if (host.includes("google.")) return "google";
        if (host.includes("bing.")) return "bing";
        if (host.includes("duckduckgo.")) return "duckduckgo";

        return "other";
      }

      // Fuente unificada: prioriza UTM y, si no hay, usa referrer
      function computeTrafficSource(utmSource, refBucket) {
        return utmSource ? `utm:${utmSource}` : `ref:${refBucket}`;
      }

      // Lectura segura de atribución guardada en la sesión
      function safeReadAttribution() {
        try {
          const raw = sessionStorage.getItem(ATTR_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          return parsed && typeof parsed === "object" ? parsed : null;
        } catch (_) {
          return null;
        }
      }

      // Escritura segura de atribución en la sesión
      function safeWriteAttribution(value) {
        try {
          sessionStorage.setItem(ATTR_KEY, JSON.stringify(value));
        } catch (_) {}
      }

      // Captura de atribución de esta carga de página
      const currentUtm = getUtmParamsFromUrl();
      const currentRefBucket = getReferrerBucket();
      const currentTrafficSource = computeTrafficSource(currentUtm.utm_source, currentRefBucket);

      // Recupera o inicializa atribución (primer toque + último toque)
      let stored = safeReadAttribution();

      if (!stored) {
        // Primera visita dentro de la sesión
        stored = {
          first_touch: {
            ...currentUtm,
            referrer_bucket: currentRefBucket,
            traffic_source: currentTrafficSource,
            ts: Date.now()
          },
          last_touch: {
            ...currentUtm,
            referrer_bucket: currentRefBucket,
            traffic_source: currentTrafficSource,
            ts: Date.now()
          }
        };
        safeWriteAttribution(stored);
      } else {
        // Si llegan UTM nuevas o hay referrer externo, actualiza último toque
        const hasNewUtm =
          Boolean(currentUtm.utm_source) ||
          Boolean(currentUtm.utm_medium) ||
          Boolean(currentUtm.utm_campaign) ||
          Boolean(currentUtm.utm_content) ||
          Boolean(currentUtm.utm_term);

        const meaningfulRef = currentRefBucket !== "internal";

        if (hasNewUtm || meaningfulRef) {
          stored.last_touch = {
            ...currentUtm,
            referrer_bucket: currentRefBucket,
            traffic_source: currentTrafficSource,
            ts: Date.now()
          };
          safeWriteAttribution(stored);
        }
      }

      const first = stored.first_touch || {};
      const last = stored.last_touch || {};

      // Campos de atribución compartidos en todos los eventos
      const attribution = {
        referrer_bucket_first: first.referrer_bucket || null,
        referrer_bucket_last: last.referrer_bucket || null,

        traffic_source_first: first.traffic_source || null,
        traffic_source_last: last.traffic_source || null,

        utm_source_first: first.utm_source || null,
        utm_medium_first: first.utm_medium || null,
        utm_campaign_first: first.utm_campaign || null,
        utm_content_first: first.utm_content || null,
        utm_term_first: first.utm_term || null,

        utm_source_last: last.utm_source || null,
        utm_medium_last: last.utm_medium || null,
        utm_campaign_last: last.utm_campaign || null,
        utm_content_last: last.utm_content || null,
        utm_term_last: last.utm_term || null
      };

      // Evento de visualización de la página secreta
      track("flat7a_view", {
        page: "flat7a",
        group_id: "flat7a",
        ...attribution
      });

      async function loadFlat7ALine() {
        try {
          const res = await fetch("/json/flat7a-lines.json", { cache: "no-store" });
          const data = await res.json();

          const list = Array.isArray(data?.base) ? data.base : data;
          if (!Array.isArray(list) || list.length === 0) return;

          const idx = Math.floor(Math.random() * list.length);
          const random = list[idx];

          const el = document.getElementById("flat7a-line");
          if (el) el.textContent = random;

          track("flat7a_line_loaded", {
            page: "flat7a",
            line_index: idx,
            line_length: String(random ?? "").length,
            ...attribution
          });
        } catch (_) {
          track("flat7a_line_load_error", {
            page: "flat7a",
            ...attribution
          });
        }
      }

      loadFlat7ALine();

      const openAppLink = document.getElementById("flat7a-open-app");
      const getAppLink = document.getElementById("flat7a-get-app");

      let deeplinkClickedAt = 0;
      let fallbackTimeoutId = null;
      let pageHiddenAfterDeepLink = false;

      // Si la app se abre por deep link, la pestaña suele pasar a "hidden"
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          pageHiddenAfterDeepLink = true;
          if (fallbackTimeoutId) clearTimeout(fallbackTimeoutId);
        }
      });

      // Clic en "Open in Taldea"
      openAppLink?.addEventListener("click", () => {
        deeplinkClickedAt = Date.now();
        pageHiddenAfterDeepLink = false;

        track("flat7a_click_open_app", {
          page: "flat7a",
          group_id: "flat7a",
          scheme: "taldea://",
          ...attribution
        });

        // Heurística: si la página no se oculta en ~1.2s, probablemente no abrió la app
        fallbackTimeoutId = window.setTimeout(() => {
          if (!pageHiddenAfterDeepLink) {
            track("flat7a_deeplink_fallback_timeout", {
              page: "flat7a",
              elapsed_ms: Date.now() - deeplinkClickedAt,
              ...attribution
            });
          }
        }, 1200);
      });

      // Clic en "Get the app"
      getAppLink?.addEventListener("click", () => {
        track("flat7a_click_get_app", {
          page: "flat7a",
          destination: "/get-app/",
          ...attribution
        });
      });
    })();
  </script>  </div> </body></html>
