const TT_DEST = "/tt/kL92kDlaPzq/";

    ;(() => {
      function track(eventName, payload = {}) {
        try {
          if (window.umami && typeof window.umami.track === "function") {
            window.umami.track(eventName, payload);
          }
        } catch (_) {}
      }

      // 1) Prefer explicit src param (reliable)
      const params = new URLSearchParams(window.location.search);
      const src = (params.get("src") || "").toLowerCase();

      // 2) Fallback: try referrer (not always present)
      const ref = (document.referrer || "").toLowerCase();
      const refIsIg = ref.includes("instagram.com");
      const refIsTt = ref.includes("tiktok.com");

      let dest = "";
      let resolvedBy = "";

      if (src === "ig" || src === "instagram") {
        dest = IG_DEST;
        resolvedBy = "src_param";
      } else if (src === "tt" || src === "tiktok") {
        dest = TT_DEST;
        resolvedBy = "src_param";
      } else if (refIsIg) {
        dest = IG_DEST;
        resolvedBy = "referrer";
      } else if (refIsTt) {
        dest = TT_DEST;
        resolvedBy = "referrer";
      }

      track("join_view", {
        page: "join",
        src,
        resolved_by: resolvedBy || "none",
        ref_present: Boolean(ref),
      });

      if (dest) {
        track("join_redirect", {
          page: "join",
          destination: dest,
          resolved_by: resolvedBy,
        });

        // Replace so /join doesn’t stay in history
        window.location.replace(dest);
        return;
      }

      // 3) If we can’t infer, show a minimal chooser (rare)
      const fb = document.getElementById("join-fallback");
      if (fb) {
        fb.classList.remove("opacity-0", "translate-y-2", "pointer-events-none");
        fb.classList.add("opacity-100", "translate-y-0");
      }

      const igBtn = document.getElementById("btn-ig");
      igBtn?.addEventListener("click", () => {
        track("join_click_instagram", { page: "join", destination: IG_DEST });
      });

      const ttBtn = document.getElementById("btn-tt");
      ttBtn?.addEventListener("click", () => {
        track("join_click_tiktok", { page: "join", destination: TT_DEST });
      });
    })();
  })();</script>  <!-- ⭐ Aquí llegan los scripts -->  </body></html>
