Tap to see another drop
</button> </section> </div> <script>
    ;(async () => {
      let drops = [];
      try {
        const res = await fetch("/json/drops.json", { cache: "no-store" });
        drops = await res.json();
      } catch (e) {
        return;
      }

      const containerEl = document.getElementById("drop-container");
      const metaEl = document.getElementById("drop-meta");
      const titleEl = document.getElementById("drop-title");
      const bodyEl = document.getElementById("drop-body");
      const underlineEl = document.getElementById("drop-underline");
      const nextBtn = document.getElementById("drop-next");

      if (!containerEl || !metaEl || !titleEl || !bodyEl || !underlineEl || !nextBtn) return;
      if (!Array.isArray(drops) || drops.length === 0) {
        nextBtn.setAttribute("disabled", "true");
        nextBtn.textContent = "No drops available";
        return;
      }

      let index = 0;
      let cycleCompletedSent = false;

      function track(eventName, payload) {
        try {
          if (window.umami && typeof window.umami.track === "function") {
            window.umami.track(eventName, payload || {});
          }
        } catch (_) {}
      }

      function getMetaText(drop) {
        return (drop.dateLabel || drop.date || "") + (drop.tag ? " · " + drop.tag : "");
      }

      function getDropId(drop, i) {
        return (drop && drop.id) ? drop.id : ("drop_" + i);
      }

      function updateContent(i) {
        const drop = drops[i] || {};
        const style = drop.style || {};

        titleEl.style.color = style.titleColor || "#0f172a";
        metaEl.style.color = style.tagColor || "";
        underlineEl.style.background = style.underlineColor || "#F5B700";

        metaEl.textContent = getMetaText(drop);
        titleEl.textContent = drop.title || "";
        bodyEl.textContent = drop.body || "";

        if (drops.length > 1) {
          const rem = drops.length - (i + 1);
          nextBtn.textContent = rem > 0
            ? "Tap to see another drop (" + rem + " left)"
            : "Back to first drop";
        } else {
          nextBtn.textContent = "Only one drop available";
          nextBtn.setAttribute("disabled", "true");
        }

        track("drops_view", {
          page: "drops",
          drop_id: getDropId(drop, i),
          index: i,
          total: drops.length,
          title: drop.title || "",
          tag: drop.tag || "",
          date: drop.dateLabel || drop.date || ""
        });
      }

      updateContent(index);

      nextBtn.addEventListener("click", () => {
        if (drops.length <= 1) return;

        const fromIndex = index;
        const toIndex = (index + 1) % drops.length;
        const nextDrop = drops[toIndex] || {};

        track("drops_next_click", {
          page: "drops",
          from_index: fromIndex,
          to_index: toIndex,
          total: drops.length,
          remaining_before_wrap: drops.length - (fromIndex + 1),
          next_drop_id: getDropId(nextDrop, toIndex),
          next_title: nextDrop.title || "",
          next_tag: nextDrop.tag || ""
        });

        containerEl.classList.add("fade-out");

        setTimeout(() => {
          index = toIndex;
          updateContent(index);
          containerEl.classList.remove("fade-out");

          if (!cycleCompletedSent && fromIndex === drops.length - 1 && index === 0) {
            cycleCompletedSent = true;
            track("drops_cycle_completed", {
              page: "drops",
              total: drops.length
            });
          }
        }, 400);
      });
    })();
  </script>  </main> </body></html>
