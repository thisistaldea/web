Tap to see another drop
</button> </section> </main> <astro-head> <meta name="robots" content="noindex, nofollow"> </astro-head> <script>

    ;(async () => {
      let drops = []

      try {
        const res = await fetch("/json/drops.json", { cache: "no-store" })
        if (!res.ok) {
          console.error("drops.json not found or failed:", res.status)
          return
        }
        drops = await res.json()
      } catch (e) {
        console.error("Failed to load drops.json", e)
        return
      }

      if (!Array.isArray(drops) || drops.length === 0) return

      const metaEl = document.getElementById("drop-meta")
      const titleEl = document.getElementById("drop-title")
      const bodyEl = document.getElementById("drop-body")
      const nextBtn = document.getElementById("drop-next")

      if (!metaEl || !titleEl || !bodyEl || !nextBtn) return

      let index = 0
      const total = drops.length

      function render(i) {
        const drop = drops[i]
        if (!drop) return

        const dateLabel = drop.dateLabel || drop.date || ""
        const tag = drop.tag ? ` · ${drop.tag}` : ""

        metaEl.textContent = `${dateLabel}${tag}`
        titleEl.textContent = drop.title || ""
        bodyEl.textContent = drop.body || ""

        if (total > 1) {
          const remaining = total - (i + 1)
          if (remaining > 0) {
            nextBtn.textContent = `Tap to see another drop (${remaining} left)`
          } else {
            nextBtn.textContent = "Back to the first drop"
          }
        } else {
          nextBtn.textContent = "More drops coming soon"
        }
      }

      render(index)

      nextBtn.addEventListener("click", () => {
        if (total <= 1) return
        index = (index + 1) % total
        render(index)
      })
    })()
  </script>  </div> </body></html>
