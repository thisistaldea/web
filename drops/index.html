Tap to see another drop
</button> </section> </div> <script>
    ;(async () => {
      let drops = [];
      try {
        const res = await fetch("/json/drops.json", { cache: "no-store" });
        drops = await res.json();
      } catch (e) { return; }

      const containerEl = document.getElementById("drop-container");
      const metaEl = document.getElementById("drop-meta");
      const titleEl = document.getElementById("drop-title");
      const bodyEl = document.getElementById("drop-body");
      const underlineEl = document.getElementById("drop-underline");
      const nextBtn = document.getElementById("drop-next");

      let index = 0;

      function updateContent(i) {
        const drop = drops[i];
        const style = drop.style || {};

        // Reset de estilos por defecto
        titleEl.style.color = style.titleColor || "#0f172a";
        metaEl.style.color = style.tagColor || ""; 
        underlineEl.style.background = style.underlineColor || "#F5B700";

        // Contenido
        metaEl.textContent = `${drop.dateLabel || drop.date}${drop.tag ? ` · ${drop.tag}` : ""}`;
        titleEl.textContent = drop.title || "";
        bodyEl.textContent = drop.body || "";

        if (drops.length > 1) {
          const rem = drops.length - (i + 1);
          nextBtn.textContent = rem > 0 ? `Tap to see another drop (${rem} left)` : "Back to first drop";
        }
      }

      updateContent(index);

      nextBtn.addEventListener("click", () => {
        containerEl.classList.add("fade-out");
        setTimeout(() => {
          index = (index + 1) % drops.length;
          updateContent(index);
          containerEl.classList.remove("fade-out");
        }, 400);
      });
    })();
  </script>  </main> </body></html>
