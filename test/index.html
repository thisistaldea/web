    ;(() => {
      function track(eventName, payload = {}) {
        try {
          if (window.umami && typeof window.umami.track === "function") {
            window.umami.track(eventName, payload);
          }
        } catch (_) {}
      }

      track("ig_view", { page: "ig" });

      const motto = document.getElementById("motto");
      if (!motto) return;

      const cta = document.getElementById("cta");
      const iosCta = document.getElementById("cta-ios");
      const androidCta = document.getElementById("cta-android");

      // Visual
      const dimColor = "#242424";
      const activeColor = "#ffffff";

      // Timing
      const FADE_UP_MS = 1000;
      const HOLD_MS = 700;
      const GAP_MS = 180;
      const START_DELAY_MS = 220;
      const CTA_DELAY_MS = 250;

      // Render all lines in dim
      const spans = lines.map((text) => {
        const span = document.createElement("span");
        span.textContent = text;
        span.style.display = "block";
        span.style.width = "100%";
        span.style.textAlign = "left";
        span.style.color = dimColor;
        span.style.transition = `color ${FADE_UP_MS}ms ease`;
        motto.appendChild(span);
        return span;
      });

      function showCta() {
        if (!cta) return;

        cta.classList.remove("opacity-0", "translate-y-2", "pointer-events-none");
        cta.classList.add("opacity-100", "translate-y-0");

        track("ig_cta_show", { page: "ig" });
      }

      iosCta?.addEventListener("click", () => {
        track("ig_click_ios", {
          page: "ig",
          destination: iosCta.getAttribute("href") || "",
        });
      });

      androidCta?.addEventListener("click", () => {
        track("ig_click_android", {
          page: "ig",
          destination: androidCta.getAttribute("href") || "",
        });
      });

      function lightUp(index) {
        if (index >= spans.length) {
          window.setTimeout(showCta, CTA_DELAY_MS);
          return;
        }

        const s = spans[index];
        s.style.transition = `color ${FADE_UP_MS}ms ease`;
        s.style.color = activeColor;

        window.setTimeout(() => {
          window.setTimeout(() => lightUp(index + 1), GAP_MS);
        }, FADE_UP_MS + HOLD_MS);
      }

      window.setTimeout(() => lightUp(0), START_DELAY_MS);
    })();
  })();</script>  <!-- ⭐ Aquí llegan los scripts -->  </body></html>
